<title>Rue de Grenelle</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   RUE DE GRENELLE — feuille de style
   Papier administratif + presse. Trois états de thème :
   :root = palette claire complète ; media dark gardée ;
   [data-theme=dark] rejoue les mêmes valeurs.
   ============================================================ */
:root{
  --bleu-rf:#000091; --bleu-rf-2:#2a2ac4;
  --papier-creme:#f6f1e6; --papier-creme-bord:#e3dbc8;
  --rouge-rf:#e1000f;
  --papier:#f2f3f7; --fiche:#ffffff; --fiche-2:#eceef4;
  --encre:#1e1f26; --encre-2:#565b6b; --encre-3:#8a8fa3;
  --filet:#d8dae4; --filet-fort:#b9bdcf;
  --or:#c9a227;
  --c-reussite:#2a78d6; --c-egalite:#e87ba4; --c-sante:#1baf7a;
  --c-paix:#eb6834; --c-budget:#eda100; --c-violet:#7b4ad1;
  --ok:#0ca30c; --alerte:#d03b3b;
  --ombre:0 1px 2px rgba(30,31,38,.07),0 4px 14px rgba(30,31,38,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bleu-rf:#8585f6; --bleu-rf-2:#a2a2f8;
    --papier-creme:#232219; --papier-creme-bord:#3c3a2c;
    --rouge-rf:#ff5655;
    --papier:#14151b; --fiche:#1d1e26; --fiche-2:#262834;
    --encre:#ecedf3; --encre-2:#a6a9b8; --encre-3:#767b8e;
    --filet:#33343e; --filet-fort:#484a58;
    --or:#d9b545;
    --c-reussite:#3987e5; --c-egalite:#d55181; --c-sante:#199e70;
    --c-paix:#d95926; --c-budget:#c98500; --c-violet:#a385f0;
    --ok:#0ca30c; --alerte:#e66767;
    --ombre:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bleu-rf:#8585f6; --bleu-rf-2:#a2a2f8;
  --papier-creme:#232219; --papier-creme-bord:#3c3a2c;
  --rouge-rf:#ff5655;
  --papier:#14151b; --fiche:#1d1e26; --fiche-2:#262834;
  --encre:#ecedf3; --encre-2:#a6a9b8; --encre-3:#767b8e;
  --filet:#33343e; --filet-fort:#484a58;
  --or:#d9b545;
  --c-reussite:#3987e5; --c-egalite:#d55181; --c-sante:#199e70;
  --c-paix:#d95926; --c-budget:#c98500; --c-violet:#a385f0;
  --ok:#0ca30c; --alerte:#e66767;
  --ombre:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--papier); color:var(--encre);
  font:16px/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;
}
button{font:inherit; color:inherit}
h1,h2,h3{text-wrap:balance; margin:0}

/* ---------- HUD ---------- */
#hud{position:sticky; top:0; z-index:20; background:var(--fiche); box-shadow:var(--ombre)}
#hud .tricolore{height:4px; display:flex}
#hud .tricolore i{flex:1}
#hud .tricolore i:nth-child(1){background:#000091}
#hud .tricolore i:nth-child(2){background:#f5f5fe}
#hud .tricolore i:nth-child(3){background:#e1000f}
#hud .barre{max-width:1100px; margin:0 auto; padding:8px 16px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center}
#hud .qui{font-weight:700; font-size:.78rem; letter-spacing:.09em; text-transform:uppercase; color:var(--encre); line-height:1.25}
#hud .qui small{display:block; font-weight:400; letter-spacing:.02em; text-transform:none; color:var(--encre-2); font-size:.72rem}
#hud .jauges{display:flex; flex-wrap:wrap; gap:4px 14px; margin-left:auto}
.jauge{min-width:86px}
.jauge .nom{font-size:.62rem; letter-spacing:.07em; text-transform:uppercase; color:var(--encre-2); display:flex; justify-content:space-between; gap:6px}
.jauge .nom b{color:var(--encre); font-variant-numeric:tabular-nums; letter-spacing:0}
.jauge .rail{height:4px; background:var(--fiche-2); border-radius:2px; margin-top:2px; overflow:hidden}
.jauge .rail i{display:block; height:100%; border-radius:2px; transition:width .5s ease}
.jauge .delta{font-size:.62rem; color:var(--encre-3); font-variant-numeric:tabular-nums}
.jauge .delta.up{color:var(--ok)} .jauge .delta.down{color:var(--alerte)}
#hud .sous{max-width:1100px; margin:0 auto; padding:0 16px 7px; display:flex; flex-wrap:wrap; gap:4px 16px; font-size:.7rem; color:var(--encre-2)}
#hud .sous span{white-space:nowrap; font-variant-numeric:tabular-nums}
#hud .sous b{color:var(--encre); font-weight:600}

/* ---------- scène ---------- */
#scene{max-width:1100px; margin:0 auto; padding:26px 16px 90px}
.doc{background:var(--fiche); border:1px solid var(--filet); box-shadow:var(--ombre); padding:28px clamp(18px,4vw,44px); margin:0 auto; max-width:860px}
.doc.large{max-width:1100px}
.entete-doc{display:flex; justify-content:space-between; gap:12px; align-items:baseline; border-bottom:2px solid var(--encre); padding-bottom:10px; margin-bottom:18px}
.entete-doc .type{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--bleu-rf)}
.entete-doc .date{font-size:.75rem; color:var(--encre-2); font-variant-numeric:tabular-nums; white-space:nowrap}
.doc h2{font-size:clamp(1.25rem,3vw,1.7rem); line-height:1.2; font-weight:700; margin:0 0 8px}
.doc .chapo{color:var(--encre-2); max-width:62ch; margin:0 0 4px}
.doc p{max-width:66ch}

.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
.btn{cursor:pointer; border:1px solid var(--bleu-rf); background:var(--bleu-rf); color:#fff;
  padding:10px 18px; font-weight:600; font-size:.92rem; border-radius:0}
:root[data-theme="dark"] .btn{color:#14151b}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#14151b} }
.btn:hover{background:var(--bleu-rf-2); border-color:var(--bleu-rf-2)}
.btn:focus-visible,.carte:focus-visible,.opt:focus-visible{outline:2px solid var(--bleu-rf); outline-offset:2px}
.btn.sec{background:transparent; color:var(--bleu-rf)}
.btn.sec:hover{background:var(--fiche-2)}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- options (choix à réponses) ---------- */
.opts{display:grid; gap:10px; margin-top:18px}
.opt{cursor:pointer; text-align:left; background:var(--fiche); border:1px solid var(--filet); border-left:3px solid var(--filet-fort); padding:13px 16px}
.opt:hover{border-color:var(--bleu-rf); border-left-color:var(--bleu-rf)}
.opt b{display:block; margin-bottom:2px}
.opt .det{display:block; font-size:.85rem; color:var(--encre-2); max-width:70ch}
.opt .det.mot{margin-top:5px; font-family:"Newsreader",georgia,serif; font-style:italic; color:var(--encre-3)}
.opt .chiffres{display:flex; flex-wrap:wrap; gap:3px 14px; margin-top:7px; padding-top:6px; border-top:1px dotted var(--filet);
  font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--encre-2); font-variant-numeric:tabular-nums}
.opt .chiffres .neg{color:var(--alerte)} .opt .chiffres .pos{color:var(--ok)}
.opt .chiffres b{display:inline; margin:0}

/* ---------- doctrine ---------- */
.classement{display:grid; gap:8px; margin:18px 0; counter-reset:rang}
.rang{display:flex; align-items:center; gap:12px; background:var(--fiche-2); border:1px solid var(--filet); padding:10px 14px}
.rang::before{counter-increment:rang; content:counter(rang); font-weight:700; font-size:1.05rem; color:var(--bleu-rf); width:1.2em; text-align:center; font-variant-numeric:tabular-nums}
.rang .pastille{width:10px; height:10px; border-radius:50%; flex:none}
.rang .lib{flex:1; font-weight:600}
.rang .poids{font-size:.75rem; color:var(--encre-2); font-variant-numeric:tabular-nums}
.rang .fleches{display:flex; gap:4px}
.rang .fleches button{cursor:pointer; border:1px solid var(--filet-fort); background:var(--fiche); width:30px; height:30px; font-size:.85rem}
.rang .fleches button:hover{border-color:var(--bleu-rf); color:var(--bleu-rf)}

/* ---------- documents papier (bordereaux, dossiers) ---------- */
.doc.papier{background:var(--papier-creme); border-color:var(--papier-creme-bord)}

/* ---------- HUD hiérarchisé : 3 grands + le reste replié ---------- */
.jauge.grande{min-width:150px}
.jauge.grande .nom{font-size:.7rem}
.jauge.grande .nom b{font-size:.95rem}
.jauge.grande .rail{height:7px}
#hud .repli-btn{cursor:pointer; border:1px solid var(--filet-fort); background:var(--fiche); color:var(--encre-2); font-size:.68rem; font-weight:600; letter-spacing:.05em; padding:4px 10px; align-self:center}
#hud .repli-btn:hover{border-color:var(--bleu-rf); color:var(--bleu-rf)}
#hud .replie[hidden]{display:none}

.prios{display:flex; flex-wrap:wrap; gap:4px}
.prio{font-size:.68rem; font-weight:600; padding:2px 8px; border:1px solid var(--filet-fort); display:inline-flex; align-items:center; gap:5px}
.prio .pastille{width:8px; height:8px; border-radius:50%}
.prio.p1{border-color:var(--bleu-rf)}

/* ---------- panneau de revalorisation ---------- */
.salaire{border-top:1px dashed var(--filet-fort); padding-top:10px; display:grid; gap:10px}
.salaire .curseur-md label{font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--encre-2); display:flex; justify-content:space-between; gap:8px}
.salaire .curseur-md label b{font-family:"IBM Plex Mono",monospace; color:var(--encre); font-size:.9rem; letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums}
.salaire input[type=range]{width:100%; accent-color:var(--bleu-rf); margin:4px 0 0}
.salaire .reperes{display:flex; justify-content:space-between; font-size:.62rem; color:var(--encre-3)}
.salaire .chiffrage{background:var(--fiche-2); border-left:3px solid var(--c-budget); padding:9px 11px; font-size:.76rem; display:grid; gap:3px}
.salaire .chiffrage .l{display:flex; justify-content:space-between; gap:10px}
.salaire .chiffrage .l b{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:500}
.salaire .chiffrage .src{color:var(--encre-3); font-size:.68rem; border-top:1px dashed var(--filet-fort); padding-top:5px; margin-top:3px}
.salaire .note-i{font-size:.72rem; color:var(--encre-2); max-width:60ch}

/* ---------- deltas d'acteurs (avant validation) ---------- */
.deltas-acteurs{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.delta-a{font-family:"IBM Plex Mono",monospace; font-size:.74rem; padding:3px 9px; border:1px solid var(--filet-fort); background:var(--fiche); font-variant-numeric:tabular-nums}
.delta-a.pos{color:var(--ok); border-color:var(--ok)}
.delta-a.neg{color:var(--alerte); border-color:var(--alerte)}

/* ---------- tamponner ---------- */
.btn.tamponner{transform:rotate(-1.5deg); letter-spacing:.06em; text-transform:uppercase; font-weight:700}
.btn.tamponner:active{transform:rotate(-1.5deg) scale(1.12)}
@media (prefers-reduced-motion: no-preference){ .btn.tamponner{transition:transform .15s ease-out} }

/* ---------- risque de grève par réponse ---------- */
.risque-ligne{display:flex; gap:10px; align-items:baseline; font-size:.76rem; color:var(--encre-2); margin-top:4px}
.risque-ligne b{font-variant-numeric:tabular-nums}

/* ---------- scellés ouverts ---------- */
.scelles{background:var(--fiche); border:1px solid var(--filet); border-left:3px solid var(--or); max-width:860px; margin:0 auto 14px; padding:14px 18px}
.scelles .titre-d{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--or); margin-bottom:6px}
.scelles .ligne-s{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:.85rem; padding:4px 0; border-top:1px dashed var(--filet)}
.scelles .ligne-s:first-of-type{border-top:0}
.scelles .val{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; font-weight:500}

/* ---------- barre budgétaire ---------- */
.budget-bloc{border:1px solid var(--filet); background:var(--fiche); padding:12px 16px; margin:0 0 14px}
.budget-bloc .titre-b{font-size:.68rem; letter-spacing:.11em; text-transform:uppercase; font-weight:700; color:var(--encre-2); display:flex; justify-content:space-between; gap:10px}
.budget-bloc .titre-b b{color:var(--encre); letter-spacing:0; text-transform:none; font-variant-numeric:tabular-nums}
.budget-barre{display:flex; height:18px; border:1px solid var(--filet-fort); margin:6px 0 4px; overflow:hidden}
.budget-barre i{display:block; height:100%}
.budget-barre .salaires{background:var(--filet)}
.budget-barre .autres{background:var(--filet-fort)}
.budget-barre .engage{background:var(--c-paix)}
.budget-barre .libre{background:var(--c-sante)}
.budget-legende{display:flex; flex-wrap:wrap; gap:4px 16px; font-size:.7rem; color:var(--encre-2)}
.budget-legende b{color:var(--encre); font-variant-numeric:tabular-nums}
.budget-legende .puce{display:inline-block; width:9px; height:9px; margin-right:4px; vertical-align:baseline}

/* ---------- comment ça marche ---------- */
.mecanisme{background:var(--fiche-2); border:1px solid var(--filet); padding:12px 16px; margin:14px 0; font-size:.85rem}
.mecanisme .titre-d{font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--bleu-rf); margin-bottom:6px}
details.mecanisme>summary.titre-d{cursor:pointer; list-style:revert; margin-bottom:0}
details.mecanisme[open]>summary.titre-d{margin-bottom:6px}
.mecanisme ol{margin:0; padding-left:20px; max-width:72ch}
.mecanisme li{margin:4px 0}

/* ---------- effets d'image ---------- */
.chiffres .image{color:var(--encre-3); border-bottom:1px dashed var(--filet-fort)}
.note-image{font-size:.72rem; color:var(--encre-3); max-width:70ch}

/* ---------- projets 2027 (doctrine) ---------- */
.rang-bloc{background:var(--fiche-2); border:1px solid var(--filet)}
.rang-bloc .rang{background:transparent; border:0}
.rang-bloc details{padding:0 14px 10px 44px}
.rang-bloc summary{cursor:pointer; font-size:.76rem; color:var(--bleu-rf); font-weight:600; list-style:none}
.rang-bloc summary::before{content:"▸ "; }
.rang-bloc details[open] summary::before{content:"▾ "}
.rang-bloc .sous-titre{font-size:.76rem; color:var(--encre-2); padding:0 14px 6px 44px; margin:-4px 0 0; max-width:70ch}
.rang-bloc .projet{font-size:.8rem; margin:6px 0 0; max-width:70ch}
.rang-bloc .projet b{color:var(--encre)}
.decode{background:var(--fiche); border:1px solid var(--filet); border-left:3px solid var(--bleu-rf); padding:14px 18px; max-width:860px; margin:0 auto 14px}
.decode .titre-d{font-size:.68rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--bleu-rf); margin-bottom:6px}
.decode p{margin:6px 0; font-size:.92rem; max-width:72ch}

/* ---------- dossier d'été ---------- */
.decryptage{background:var(--fiche-2); border-left:3px solid var(--or); padding:12px 16px; margin-top:16px}
.decryptage .titre-d{font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:var(--or)}
.decryptage p{margin:6px 0 0; font-size:.92rem; max-width:70ch}

/* ---------- comprendre l'effet ---------- */
.legende-cadenas{font-size:.76rem; color:var(--encre-2); background:var(--fiche-2); border:1px solid var(--filet); padding:8px 14px; margin:0 0 14px; max-width:72ch}
.carte .corps{display:none; flex-direction:column; gap:8px}
.carte.ouverte .corps{display:flex}
.carte .barre-actions{display:flex; gap:8px; margin-top:2px}
.carte .btn-mini{cursor:pointer; font-size:.74rem; font-weight:600; padding:6px 10px; border:1px solid var(--filet-fort); background:var(--fiche); color:var(--encre-2)}
.carte .btn-mini:hover{border-color:var(--bleu-rf); color:var(--bleu-rf)}
.carte .btn-retenir{border-color:var(--bleu-rf); color:var(--bleu-rf)}
.carte.sel .btn-retenir{background:var(--bleu-rf); color:var(--fiche)}
.carte .comprendre{display:none; background:var(--fiche-2); border-left:3px solid var(--c-sante); padding:10px 12px; font-size:.8rem}
.carte .comprendre.visible{display:block}
.carte .comprendre .titre-d{font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--c-sante)}
.carte .comprendre p{margin:5px 0; max-width:70ch}
.carte .comprendre .idee{border-top:1px dashed var(--filet-fort); margin-top:8px; padding-top:8px}
.carte .comprendre .idee .titre-d{color:var(--rouge-rf)}
.carte .plie{font-size:.78rem; color:var(--encre-2)}
.carte .plie .reste{color:var(--encre-3); font-variant-numeric:tabular-nums}

/* ---------- curseurs (carte scolaire) ---------- */
.curseur{margin:20px 0}
.curseur label{font-weight:600; display:block; margin-bottom:2px}
.curseur .aide{font-size:.83rem; color:var(--encre-2); max-width:70ch; margin-bottom:8px}
.curseur input[type=range]{width:100%; accent-color:var(--bleu-rf)}
.curseur .lecture{font-family:"IBM Plex Mono",monospace; font-size:.85rem; color:var(--encre); background:var(--fiche-2); padding:8px 12px; margin-top:6px; font-variant-numeric:tabular-nums}

/* ---------- atelier / cartes-mesures ---------- */
.solde{position:sticky; top:86px; z-index:5; background:var(--fiche); border:1px solid var(--filet-fort); padding:9px 14px; display:flex; flex-wrap:wrap; gap:6px 22px; font-family:"IBM Plex Mono",monospace; font-size:.82rem; margin-bottom:16px; font-variant-numeric:tabular-nums}
.solde b{font-weight:500}
.solde .neg{color:var(--alerte)}
.grille-cartes{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:14px}
.carte{cursor:pointer; text-align:left; background:var(--fiche); border:1px solid var(--filet); border-top:3px solid var(--filet-fort); padding:14px 16px 12px; display:flex; flex-direction:column; gap:8px; position:relative}
.carte:hover{border-color:var(--bleu-rf)}
.carte.sel{border-color:var(--bleu-rf); border-top-color:var(--bleu-rf); background:var(--fiche); box-shadow:inset 0 0 0 1px var(--bleu-rf)}
.carte.sel::after{content:"SÉLECTIONNÉE"; position:absolute; top:8px; right:10px; font-size:.58rem; letter-spacing:.1em; font-weight:700; color:var(--bleu-rf)}
.carte .famille{font-size:.62rem; letter-spacing:.11em; text-transform:uppercase; font-weight:700; padding-right:92px}
.carte h3{font-size:.98rem; line-height:1.3; font-weight:600; padding-right:8px}
.carte .porteurs{font-size:.74rem; color:var(--encre-2)}
.carte .porteurs b{font-weight:600; color:var(--encre)}
.carte .chiffres{display:flex; flex-wrap:wrap; gap:4px 14px; font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--encre-2); font-variant-numeric:tabular-nums}
.carte .chiffres .neg{color:var(--alerte)} .carte .chiffres .pos{color:var(--ok)}
.carte .reels{display:grid; gap:3px; font-size:.76rem}
.carte .reels .ligne{display:flex; gap:8px; align-items:baseline}
.carte .reels .verrous{letter-spacing:1px; white-space:nowrap}
.carte .reels .src{color:var(--encre-3); font-size:.7rem}
.carte .alerte-greve{font-size:.72rem; color:var(--rouge-rf); font-weight:600}
.carte .mot{font-family:"Newsreader",georgia,serif; font-style:italic; font-size:.92rem; color:var(--encre-2); border-top:1px solid var(--filet); padding-top:8px; margin-top:auto; line-height:1.4}
.carte .curseurs-carte{display:grid; gap:6px; border-top:1px dashed var(--filet-fort); padding-top:8px}
.carte .curseurs-carte label{font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--encre-2); display:block}
.carte select{width:100%; font:inherit; font-size:.82rem; padding:5px 6px; background:var(--fiche-2); color:var(--encre); border:1px solid var(--filet-fort)}

/* ---------- journal / presse ---------- */
.journal{background:var(--fiche); border:1px solid var(--filet); box-shadow:var(--ombre); max-width:860px; margin:0 auto; padding:26px clamp(18px,4vw,44px); font-family:"Newsreader",georgia,serif}
.journal .manchette{display:flex; justify-content:space-between; align-items:baseline; gap:10px; border-bottom:3px double var(--encre); padding-bottom:6px}
.journal .titre-j{font-weight:700; font-size:1.25rem; letter-spacing:.01em}
.journal .ours{font-family:"Public Sans",sans-serif; font-size:.66rem; color:var(--encre-2); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.journal h2.une{font-size:clamp(1.5rem,4.4vw,2.3rem); line-height:1.08; font-weight:700; margin:16px 0 8px}
.journal .sous-une{font-size:1.02rem; font-style:italic; color:var(--encre-2); max-width:60ch}
.journal .breves{margin-top:18px; border-top:1px solid var(--encre); padding-top:10px; display:grid; gap:9px}
.journal .breve{font-size:.94rem; line-height:1.35}
.journal .breve b{font-weight:700}
.journal .breve .sig{font-family:"Public Sans",sans-serif; font-size:.66rem; color:var(--encre-3); text-transform:uppercase; letter-spacing:.07em}

/* ---------- fil social ---------- */
.fil{max-width:860px; margin:14px auto 0; display:grid; gap:8px}
.post{background:var(--fiche); border:1px solid var(--filet); padding:10px 14px; font-size:.88rem}
.post .auteur{font-weight:700; font-size:.8rem}
.post .pseudo{color:var(--encre-3); font-weight:400; font-size:.75rem}
.post p{margin:3px 0 0; max-width:75ch}

/* ---------- dépêche mono ---------- */
.depeche{font-family:"IBM Plex Mono",monospace; font-size:.8rem; background:var(--fiche-2); border-left:3px solid var(--filet-fort); padding:10px 14px; margin:8px 0; color:var(--encre-2); max-width:75ch}
.depeche b{color:var(--encre); font-weight:500}

/* ---------- tableaux du bilan ---------- */
.defile{overflow-x:auto}
table.bilan{border-collapse:collapse; width:100%; font-size:.86rem; font-variant-numeric:tabular-nums}
table.bilan th{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--encre-2); text-align:left; padding:6px 10px; border-bottom:2px solid var(--encre)}
table.bilan td{padding:7px 10px; border-bottom:1px solid var(--filet)}
table.bilan .num{text-align:right}
.verdict{font-family:"Newsreader",georgia,serif; font-size:1.15rem; font-style:italic; margin:14px 0; max-width:60ch; line-height:1.45}
.score-final{display:flex; flex-wrap:wrap; gap:14px; margin:18px 0}
.score-bloc{flex:1; min-width:150px; background:var(--fiche-2); border-top:3px solid var(--bleu-rf); padding:12px 16px}
.score-bloc .val{font-size:1.9rem; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1}
.score-bloc .lib{font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; color:var(--encre-2)}
.revele{color:var(--encre-3)} .revele.bon{color:var(--ok); font-weight:600} .revele.mauvais{color:var(--alerte); font-weight:600}

/* ---------- accueil ---------- */
.accueil{max-width:720px; margin:6vh auto 0; text-align:center}
.accueil .tampon{display:inline-block; border:3px double var(--bleu-rf); color:var(--bleu-rf); padding:10px 26px; transform:rotate(-2.5deg); margin-bottom:26px}
.accueil .tampon .rf{font-size:.68rem; letter-spacing:.28em; font-weight:700}
.accueil h1{font-size:clamp(2.1rem,7vw,3.4rem); letter-spacing:.05em; font-weight:700; text-transform:uppercase}
.accueil .devise{font-family:"Newsreader",georgia,serif; font-style:italic; font-size:1.12rem; color:var(--encre-2); margin:10px auto 26px; max-width:52ch}
.accueil .avertissement{font-size:.72rem; color:var(--encre-3); max-width:58ch; margin:26px auto 0}
.note-passation{font-family:"Newsreader",georgia,serif; font-size:1.05rem; background:var(--fiche-2); border:1px solid var(--filet); padding:16px 20px; margin:16px 0; line-height:1.5; max-width:62ch}
.note-passation .ps{font-style:italic; color:var(--encre-2); display:block; margin-top:8px}

.suite{position:fixed; bottom:0; left:0; right:0; z-index:15; background:var(--fiche); border-top:1px solid var(--filet); box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.suite .in{max-width:1100px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:16px; justify-content:space-between}
.suite .contexte{font-size:.78rem; color:var(--encre-2)}

/* ---------- repères sourcés : note de cadrage + onglet « comprendre » ---------- */
.reperes{margin:18px 0}
.rep-theme{border:1px solid var(--filet); background:var(--fiche); margin-bottom:12px}
.rep-theme > summary{cursor:pointer; padding:12px 16px; list-style:none; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.rep-theme > summary::-webkit-details-marker{display:none}
.rep-theme > summary::before{content:'+'; font-family:"IBM Plex Mono",monospace; font-weight:700; color:var(--bleu-rf); width:1ch}
.rep-theme[open] > summary::before{content:'−'}
.rep-theme > summary h4{font-size:.95rem; font-weight:700; margin:0}
.rep-theme > summary .res{font-family:"Newsreader",georgia,serif; font-style:italic; color:var(--encre-2); font-size:.86rem; flex:1; min-width:14ch}
.rep-corps{padding:0 16px 16px; border-top:1px solid var(--filet)}
.rep-liste{list-style:none; margin:14px 0 0; padding:0}
.rep-liste li{display:flex; gap:14px; padding:9px 0; border-bottom:1px dotted var(--filet); align-items:baseline}
.rep-liste li:last-child{border-bottom:0}
.rep-liste .v{font-family:"IBM Plex Mono",monospace; font-weight:700; font-size:.95rem; color:var(--bleu-rf); min-width:9.5em; flex-shrink:0; font-variant-numeric:tabular-nums}
.rep-liste .l{font-size:.86rem; line-height:1.5}
.rep-liste .l cite{display:block; font-style:normal; font-size:.7rem; color:var(--encre-3); margin-top:3px}
.rep-liste .l cite a{color:inherit}
.rep-retenir{margin-top:16px; background:var(--fiche-2); border-left:3px solid var(--bleu-rf); padding:12px 16px; font-family:"Newsreader",georgia,serif; font-size:1rem; line-height:1.5}
.rep-retenir b{font-family:"Public Sans",system-ui,sans-serif; font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; display:block; color:var(--encre-2); margin-bottom:5px}
.rep-serie{display:flex; align-items:flex-end; gap:5px; height:132px; margin:18px 0 4px; padding-top:6px}
.rep-serie .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; min-width:0}
.rep-serie .bar{width:100%; background:var(--bleu-rf); opacity:.85}
.rep-serie .col.prev .bar{background:repeating-linear-gradient(45deg,var(--bleu-rf),var(--bleu-rf) 3px,transparent 3px,transparent 6px); border:1px solid var(--bleu-rf)}
.rep-serie .md{font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-variant-numeric:tabular-nums}
.rep-serie .an{font-size:.62rem; color:var(--encre-3); font-variant-numeric:tabular-nums}
.rep-serie-note{font-size:.72rem; color:var(--encre-3); line-height:1.5}
.rep-sources{margin-top:8px; font-size:.74rem; line-height:1.6}
.rep-sources li{margin-bottom:7px}
.rep-sources .org{font-weight:600}

/* ---------- note de cadrage : pages courtes, graphiques honnêtes ---------- */
.cadrage-bloc{border:1px solid var(--filet); background:var(--fiche); padding:16px 18px 14px; margin:16px 0}
.cadrage-bloc h3{font-size:1.05rem; font-weight:700; margin:0 0 4px}
.cadrage-phrase{font-family:"Newsreader",georgia,serif; font-size:1.02rem; line-height:1.5; color:var(--encre-2); margin:0 0 10px; max-width:66ch}
.cadrage-retenir{margin:12px 0 0; padding-top:10px; border-top:1px solid var(--filet); font-size:.86rem; font-weight:600; color:var(--bleu-rf)}
.cadrage-bloc .rep-liste{margin-top:10px}

/* graphiques de la note de cadrage */
.accroche{display:flex; gap:16px; align-items:baseline; margin:6px 0 14px; flex-wrap:wrap}
.accroche b{font-size:clamp(1.9rem,5vw,2.6rem); font-weight:700; color:var(--bleu-rf); line-height:1; font-variant-numeric:tabular-nums; flex-shrink:0}
.accroche p{margin:0; font-family:"Newsreader",georgia,serif; font-size:1.04rem; line-height:1.5; flex:1; min-width:20ch; max-width:60ch}
.accroche cite{display:block; font-style:normal; font-size:.7rem; color:var(--encre-3); margin-top:4px}
.accroche cite a{color:inherit}

/* Histogramme : valeurs, tracé et années dans trois rangées de même gabarit,
   pour que l'axe, les barres et les libellés ne puissent pas se décaler. */
.rep-plot{position:relative; height:132px; padding-left:30px; margin:2px 0 0}
.rep-plot .grad{position:absolute; left:30px; right:0; height:1px; background:var(--filet); z-index:0}
.rep-plot .grad b{position:absolute; left:-30px; top:-7px; width:24px; text-align:right;
  font-size:.64rem; font-weight:400; color:var(--encre-3); font-variant-numeric:tabular-nums; display:block}
.rep-cols{position:absolute; inset:0 0 0 30px; display:flex; align-items:flex-end; gap:5px; z-index:1}
.rep-cols .col{flex:1; display:flex; align-items:flex-end; min-width:0}
.rep-cols .bar{width:100%; background:var(--bleu-rf)}
.rep-cols .col.prev .bar{background:repeating-linear-gradient(45deg,var(--bleu-rf),var(--bleu-rf) 3px,transparent 3px,transparent 6px); border:1px solid var(--bleu-rf)}
.rep-valeurs,.rep-annees{display:flex; gap:5px; padding-left:30px}
.rep-valeurs span,.rep-annees span{flex:1; text-align:center; min-width:0; font-variant-numeric:tabular-nums}
.rep-valeurs span{font-family:"IBM Plex Mono",monospace; font-size:.68rem; padding-bottom:3px}
.rep-annees span{font-size:.62rem; color:var(--encre-3); padding-top:4px}

@media (max-width:640px){
  .rep-plot,.rep-valeurs,.rep-annees{padding-left:22px}
  .rep-plot .grad{left:22px} .rep-plot .grad b{left:-22px; width:18px; font-size:.58rem}
  .rep-cols{inset:0 0 0 22px; gap:3px}
  .rep-valeurs,.rep-annees{gap:3px}
  .rep-valeurs span{font-size:.58rem} .rep-annees span{font-size:.55rem}
  .accroche b{font-size:2rem}
}
.rep-courbe{width:100%; height:auto; display:block; margin:10px 0 4px; overflow:visible}
.rep-courbe .grille{stroke:var(--filet); stroke-width:1}
.rep-courbe .tick{font-size:9px; fill:var(--encre-3); font-family:"IBM Plex Mono",monospace}
.rep-courbe .an{font-size:9.5px; fill:var(--encre-3); font-family:"IBM Plex Mono",monospace}
.rep-courbe .trait{fill:none; stroke-width:2.6; stroke-linejoin:round; stroke-linecap:round}
.rep-courbe .trait.constate{stroke:var(--bleu-rf)}
.rep-courbe .trait.projete{stroke:var(--c-violet); stroke-dasharray:6 4}
.rep-courbe .trait.chute{stroke:var(--rouge-rf)}
.rep-courbe .pt.constate{fill:var(--bleu-rf)}
.rep-courbe .pt.projete{fill:var(--fiche); stroke:var(--c-violet); stroke-width:2}
.rep-courbe .pt.chute{fill:var(--rouge-rf)}
.rep-courbe .val{font-size:11px; font-weight:700; font-family:"IBM Plex Mono",monospace}
.rep-courbe .val.constate{fill:var(--bleu-rf)}
.rep-courbe .val.projete{fill:var(--c-violet)}
.rep-courbe .val.chute{fill:var(--rouge-rf)}
.rep-courbe .annot{font-size:11px; font-weight:700; fill:var(--rouge-rf)}

.rep-lgd{display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:.72rem; color:var(--encre-2); margin:2px 0 8px}
.rep-lgd i{width:16px; height:3px; display:inline-block; flex-shrink:0; margin-left:8px}
.rep-lgd i:first-child{margin-left:0}
.rep-lgd i.c-bleu{background:var(--bleu-rf)}
.rep-lgd i.c-bleu-bloc{height:11px; background:var(--bleu-rf)}
.rep-lgd i.c-violet{background:var(--c-violet)}
.rep-lgd i.c-rouge{background:var(--rouge-rf)}
.rep-lgd i.c-hachure{height:11px; background:repeating-linear-gradient(45deg,var(--bleu-rf),var(--bleu-rf) 2px,transparent 2px,transparent 4px); border:1px solid var(--bleu-rf)}
.rep-lgd .unite{margin-left:auto; color:var(--encre-3); font-style:italic}
@media (max-width:640px){ .rep-lgd .unite{margin-left:0; width:100%} }

.rep-comp{display:flex; flex-direction:column; gap:12px; margin:12px 0 4px}
.comp-titre{font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; color:var(--encre-2); font-weight:700; margin-bottom:5px; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
.comp-ligne{display:flex; align-items:center; gap:9px; margin-bottom:3px}
.comp-ligne .qui{font-size:.72rem; color:var(--encre-3); width:11ch; flex-shrink:0; text-align:right}
.comp-ligne .piste{flex:1; min-width:0}
.comp-ligne i{height:13px; display:block}
.comp-ligne i.fr{background:var(--bleu-rf)}
.comp-ligne i.ref{background:var(--filet-fort)}
.comp-ligne b{font-family:"IBM Plex Mono",monospace; font-size:.8rem; font-variant-numeric:tabular-nums; width:4ch; flex-shrink:0}
.comp-ecart{font-size:.7rem; font-weight:700; letter-spacing:0; text-transform:none}
.comp-ecart.neg{color:var(--alerte)} .comp-ecart.pos{color:var(--ok)}
@media (max-width:640px){ .comp-ligne .qui{width:8ch} }
#comprendre-btn{position:fixed; left:12px; bottom:12px; z-index:30; font-size:.74rem; padding:7px 13px; border:1px solid var(--filet); background:var(--fiche); color:var(--encre-2); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); border-radius:2px}
#comprendre-btn:hover{color:var(--bleu-rf); border-color:var(--bleu-rf)}
#comprendre{position:fixed; inset:0; z-index:60; background:var(--papier); overflow-y:auto; overscroll-behavior:contain; padding:0 16px 60px}
#comprendre .in{max-width:920px; margin:0 auto}
#comprendre .tete{position:sticky; top:0; z-index:2; background:var(--papier); padding:16px 0 12px; margin-bottom:6px; border-bottom:1px solid var(--filet); display:flex; align-items:center; justify-content:space-between; gap:16px}
#comprendre .tete h2{margin:0; font-size:1.35rem}
#comprendre h3{margin:22px 0 8px; font-size:1rem}
#comprendre .chapo{margin:14px 0 18px}
body:has(#comprendre:not([hidden])) #comprendre-btn{display:none}
body:has(.suite:not([hidden])) #comprendre-btn{bottom:62px}
/* entretien de l'Élysée, profil déclaré, fléchage de la rallonge */
.plateau-num{font-size:.62rem; text-transform:uppercase; letter-spacing:.1em; font-weight:700; color:var(--rouge-rf); margin-bottom:5px}
.entretien-q{border-top:1px solid var(--filet); padding-top:14px; margin-top:16px}
.entretien-q:first-child{border-top:0; margin-top:8px}
.entretien-q h3{font-size:1rem; font-weight:700; margin:0 0 3px}
.entretien-q .aparte{font-family:"Newsreader",georgia,serif; font-style:italic; color:var(--encre-3); font-size:.9rem; margin:0 0 10px; max-width:64ch}
.opt.choisi{border-color:var(--bleu-rf); border-left-color:var(--bleu-rf); background:var(--fiche-2); box-shadow:inset 3px 0 0 var(--bleu-rf)}
.opt.choisi b{color:var(--bleu-rf)}
.flechage{border:1px solid var(--filet); border-left:3px solid var(--c-budget); background:var(--fiche-2); padding:13px 16px; margin:14px 0}
.flechage .titre-d{font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--c-budget); margin-bottom:5px}
.flechage .det{font-size:.85rem; color:var(--encre-2); margin:0 0 10px; max-width:70ch}
.flechage-liste{display:flex; flex-direction:column; gap:6px}
.flechage-liste .opt{padding:9px 12px}
/* ---------- profil du ministre et affaires ---------- */
.profil-bloc{border:1px solid var(--filet); background:var(--fiche-2); padding:13px 16px; margin:14px 0}
.profil-bloc .titre-d{font-size:.62rem; letter-spacing:.1em; text-transform:uppercase; font-weight:700; color:var(--bleu-rf); margin-bottom:8px}
.profil-ligne{display:flex; gap:12px; align-items:baseline; padding:6px 0; border-bottom:1px dotted var(--filet); flex-wrap:wrap}
.profil-ligne:last-of-type{border-bottom:0}
.profil-ligne b{min-width:17ch; flex-shrink:0; font-size:.88rem}
.profil-ligne span{font-size:.84rem; color:var(--encre-2); line-height:1.5; flex:1; min-width:16ch}
.profil-note{font-size:.78rem; color:var(--encre-3); margin:9px 0 0; line-height:1.5; font-style:italic}
#hud-sous b.neg{color:var(--alerte)}
#hud-sous small{color:var(--encre-3); font-weight:400}
#hud-alertes{max-width:1100px; margin:0 auto; padding:0 16px 8px}
.alerte-hud{border-left:3px solid var(--alerte); background:var(--fiche-2); padding:7px 12px; margin-top:6px; font-size:.78rem; line-height:1.5; color:var(--encre-2)}
.alerte-hud b.t{display:block; color:var(--encre); font-size:.72rem; text-transform:uppercase; letter-spacing:.07em; margin-bottom:2px}
.alerte-hud b{color:var(--encre)}
table.bilan tr.cache td{background:var(--fiche-2)}
.bilan-note{font-size:.76rem; color:var(--encre-3); line-height:1.55; margin:8px 0 0}
.bilan-syn{list-style:none; padding:0; margin:12px 0 0}
.bilan-syn li{border-left:3px solid var(--filet-fort); padding:7px 0 7px 13px; margin-bottom:8px; font-size:.87rem; line-height:1.6}
.bilan-syn li b{color:var(--encre)}
.bilan-detail{margin-top:18px; border-top:1px solid var(--filet); padding-top:10px}
.bilan-detail>summary{cursor:pointer; font-size:.8rem; font-weight:600; letter-spacing:.03em; color:var(--bleu-rf)}
.bilan-final{font-size:.84rem; line-height:1.6; margin-top:20px; padding-top:12px; border-top:1px solid var(--filet)}
.argumentaire{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:16px 0}
.argumentaire .arg{border:1px solid var(--filet); border-top-width:3px; padding:10px 13px 12px; background:var(--fiche-2)}
.argumentaire .arg-d{border-top-color:var(--c-sante)}
.argumentaire .arg-p{border-top-color:var(--c-budget)}
.argumentaire .etiq{display:block; font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--encre-2); margin-bottom:6px}
.argumentaire .arg-d .etiq{color:var(--c-sante)}
.argumentaire .arg-p .etiq{color:var(--c-budget)}
.argumentaire .dit{font-size:.85rem; line-height:1.6; margin:0 0 8px; font-style:italic !important}
.argumentaire .verdict{font:400 .76rem/1.55 "Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-style:normal !important; color:var(--encre-2); margin:0; padding-top:7px; border-top:1px dotted var(--filet)}
@media (max-width:720px){ .argumentaire{grid-template-columns:1fr} }
.boussole{border:1px solid var(--filet); border-left:3px solid var(--bleu-rf); background:var(--fiche); padding:13px 16px 15px; margin-bottom:16px}
.bous-chapo{font-size:.82rem; line-height:1.55; color:var(--encre-2); margin:6px 0 11px}
.bous-l{display:flex; align-items:center; gap:11px; margin-bottom:7px}
.bous-l .lib{flex:0 0 clamp(140px, 30%, 250px); border-left:3px solid; padding-left:9px; font-size:.82rem; font-weight:600; line-height:1.3}
.bous-l .lib small{display:block; font-weight:400; font-size:.7rem; color:var(--encre-3); line-height:1.35; margin-top:1px}
.bous-l .rail{flex:1; height:8px; background:var(--fiche-2); border:1px solid var(--filet); min-width:40px}
.bous-l .rail i{display:block; height:100%}
.bous-l .v{flex:0 0 auto; font-size:.78rem; font-variant-numeric:tabular-nums; color:var(--encre-2); min-width:5ch; text-align:right}
.bous-note{font-size:.78rem; line-height:1.55; color:var(--encre-2); margin:11px 0 0; padding-top:9px; border-top:1px dotted var(--filet)}
@media (max-width:560px){ .bous-l{flex-wrap:wrap} .bous-l .lib{flex-basis:100%} }
.soutien-synd{border:1px solid var(--filet); border-left:3px solid var(--c-sante); background:var(--fiche-2); padding:10px 14px 12px; margin:14px 0}
.soutien-synd b{display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--c-sante); margin-bottom:5px}
.soutien-synd span{display:block; font-size:.86rem; line-height:1.6}
.soutien-synd .quoi{font-weight:600; font-size:.9rem; margin-bottom:3px}
.soutien-synd .src{font-size:.75rem; color:var(--encre-2); margin-top:7px; padding-top:7px; border-top:1px dotted var(--filet)}
.cadrage-menu{border:1px solid var(--filet); border-left:3px solid var(--bleu-rf); background:var(--fiche-2); padding:9px 14px 11px; margin:14px 0}
.cadrage-menu b{display:block; font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--bleu-rf); margin-bottom:4px}
.cadrage-menu span{display:block; font-size:.83rem; line-height:1.55; color:var(--encre-2)}

/* Toutes les conversions, en un seul endroit : l'interface les affiche,
   le moteur les applique. */
function chiffrerRevalorisation(montantMd, instrumentId, cibleId) {
  const I = REVALORISATION.instruments[instrumentId] || REVALORISATION.instruments.indiciaire;
  const C = REVALORISATION.cibles[cibleId] || REVALORISATION.cibles.tous;
  const m = Math.max(REVALORISATION.montant.min, Math.min(REVALORISATION.montant.max, montantMd));
  const concernes = Math.round(CADRAGE.etpEnseignants * C.part);
  return {
    montantMd: m,
    instrument: I, cible: C,
    concernes,
    euroParMois: (m * 1e9) / concernes / 12,            // brut mensuel moyen sur la cible
    pctPoint: m / CADRAGE.coutPointIndice,              // en % de point d'indice
    pctRattrapageFSU: (m / 10) * 100,                   // part des 10 Md€ réclamés
    coutAvecCAS: I.cas ? m * 1.43 : m,                  // CAS Pensions : 25,15 / 58,4
    gainPosition: m * POINTS_SALAIRE_PAR_MD * I.facteurPosition,
    echelle: m / REVALORISATION.montant.defaut,
  };
}

/* ============================================================================
   QUI, PARMI LES ORGANISATIONS, PORTE CETTE MESURE
   ----------------------------------------------------------------------------
   Une organisation syndicale ne demande pas le retrait d'une mesure qu'elle
   défend. C'est évident, et le jeu ne le savait pas : il choisissait la mesure
   contestée sur son seul potentiel de conflit (intensité de grève, effet
   d'annonce négatif pour les personnels), sans regarder qui la portait.

   On lit donc ici, dans les `porteurs` de la carte, lesquelles des sept
   organisations la défendent. Le rattachement est explicite et vérifiable, comme
   pour la boussole politique. Deux points d'attention :

   - « l'intersyndicale » et « les organisations syndicales » engagent les sept ;
   - le SNPDEN n'est PAS l'une des sept. C'est le syndicat des personnels de
     direction : qu'il porte une mesure ne protège en rien celle-ci de la
     contestation des syndicats d'enseignants — c'est même souvent l'inverse,
     et le statut des directeurs d'école en est l'exemple historique.
   ========================================================================== */

const TOUTES = ['fsu', 'unsa', 'fo', 'cfdt', 'cgt', 'snalc', 'sud'];

const PORTEURS_SYNDICAUX = [
  ['intersyndicale', TOUTES],
  ['organisations syndicales', TOUTES],
  ['organisation syndicale', TOUTES],
  ['collectifs d’AESH', TOUTES],
  ['FSU', ['fsu']],
  ['SNES', ['fsu']],
  ['SNUipp', ['fsu']],
  ['Sgen-CFDT', ['cfdt']],
  ['SE-Unsa', ['unsa']],
  ['UNSA', ['unsa']],
  ['SNALC', ['snalc']],
  ['CGT', ['cgt']],
  ['SUD', ['sud']],
  ['FNEC', ['fo']],
  ['Force ouvrière', ['fo']],
];

/* Les organisations, parmi les sept, qui défendent cette mesure. */
function porteursSyndicaux(carte) {
  const out = new Set();
  for (const p of carte.porteurs || []) {
    for (const [frag, ids] of PORTEURS_SYNDICAUX) if (p.includes(frag)) for (const id of ids) out.add(id);
  }
  return out;
}

/* Une mesure est contestable par une organisation si, et seulement si :
   1. cette organisation ne la porte pas ;
   2. elle ne fait pas monter l'adhésion des personnels — on ne demande pas le
      retrait de ce qui améliore le métier, quel que soit le rapport de force ;
   3. elle est effectivement conflictuelle, ce que le catalogue dit déjà par
      l'intensité de grève qu'elle porte et par ce qu'elle coûte aux personnels
      dans l'effet d'annonce. */
function estContestable(carte, org) {
  if (org && porteursSyndicaux(carte).has(org.id)) return 0;
  if ((carte.physique && carte.physique.adhesion || 0) > 0) return 0;
  if ((carte.vitrine && carte.vitrine.enseignants || 0) > 0) return 0;
  const score = (carte.greve ? carte.greve.intensite * 2 : 0)
              + Math.max(0, -(carte.vitrine && carte.vitrine.enseignants || 0));
  return score >= 4 ? score : 0;
}

/* ============================================================================
   LA BOUSSOLE : D'OÙ VIENNENT LES MESURES QU'ON PREND
   ----------------------------------------------------------------------------
   Chaque carte porte déjà, depuis le premier jour, la liste de ceux qui la
   défendent réellement dans le débat français : partis, candidats, think tanks,
   mais aussi corps d'inspection, juridictions financières, chercheurs et
   organisations professionnelles. On s'en sert ici pour une seule chose, et le
   jeu le dit sans détour : montrer au joueur, à mesure qu'il avance, de quels
   programmes ses propres décisions se rapprochent.

   Trois précautions de méthode, qui sont aussi tout l'intérêt de l'exercice :

   1. le rattachement se lit dans la carte elle-même (`porteurs`), il n'est pas
      décidé ailleurs ni ajouté après coup. Il est donc vérifiable ligne à ligne ;
   2. une même mesure est souvent portée par plusieurs bords à la fois. C'est un
      fait du débat scolaire français, pas une imprécision du jeu ;
   3. beaucoup de mesures ne sont portées par AUCUN parti : elles viennent de la
      Cour des comptes, de la DEPP, du CSEN, de l'inspection générale ou de la
      recherche. Le jeu les compte à part, et c'est probablement le chiffre le
      plus intéressant de la boussole.

   On ne dit jamais au joueur « vous êtes de tel bord ». On lui dit « ces
   mesures-là figurent aussi dans tel programme ». La conclusion lui appartient.
   ========================================================================== */

const BLOCS_2027 = {
  gauche:   { label: 'la gauche', long: 'LFI, NFP, Parti socialiste, Place publique', coul: 'var(--c-egalite)' },
  centre:   { label: 'le centre et la majorité sortante', long: 'Gabriel Attal, Édouard Philippe, Horizons, Michel Barnier', coul: 'var(--bleu-rf)' },
  droite:   { label: 'la droite', long: 'la droite parlementaire, David Lisnard, iFRAP', coul: 'var(--c-budget)' },
  extreme:  { label: 'l’extrême droite', long: 'Rassemblement national, Reconquête', coul: 'var(--rouge-rf)' },
};

/* Fragments cherchés dans les `porteurs` d'une carte. L'ordre compte : le
   premier fragment trouvé donne le bord. Tout ce qui n'est pas ici n'est pas un
   parti, et c'est délibéré : la Cour des comptes, la DEPP, le CSEN, l'IGÉSR,
   le HCSP, l'OCDE, l'IPP, les syndicats et les fédérations de parents ne sont
   rattachés à aucun bord par le jeu. */
const RATTACHEMENTS = [
  ['La France insoumise', 'gauche'], ['Nouveau Front populaire', 'gauche'],
  ['Parti socialiste', 'gauche'], ['Place publique', 'gauche'],
  ['la gauche parlementaire', 'gauche'], ['Terra Nova', 'gauche'],
  ['Fondation Jean-Jaurès', 'gauche'], ['Glucksmann', 'gauche'],
  ['Gabriel Attal', 'centre'], ['Édouard Philippe', 'centre'], ['Horizons', 'centre'],
  ['Michel Barnier', 'centre'], ['politique engagée en 2017', 'centre'],
  ['Institut Montaigne', 'centre'],
  ['droite parlementaire', 'droite'], ['candidats de droite', 'droite'],
  ['David Lisnard', 'droite'], ['iFRAP', 'droite'],
  ['Rassemblement national', 'extreme'], ['Reconquête', 'extreme'],
];

/* Les bords qui portent cette mesure, d'après ses propres porteurs. */
function bordsDeCarte(carte) {
  const out = new Set();
  for (const p of carte.porteurs || []) {
    for (const [frag, bord] of RATTACHEMENTS) if (p.includes(frag)) out.add(bord);
  }
  return [...out];
}

/* La boussole du mandat : sur les mesures effectivement annoncées, combien
   figurent aussi dans le programme de chaque bord, et combien ne viennent
   d'aucun parti. */
function boussole(ids) {
  const cartes = ids.map((id) => PAR_ID[id]).filter(Boolean);
  const parBord = { gauche: [], centre: [], droite: [], extreme: [] };
  const horsPartis = [];
  for (const c of cartes) {
    const b = bordsDeCarte(c);
    if (!b.length) horsPartis.push(c.label);
    for (const x of b) parBord[x].push(c.label);
  }
  return { total: cartes.length, parBord, horsPartis };
}

/* ============================================================================
   L'ARGUMENTAIRE SYNDICAL
   ----------------------------------------------------------------------------
   Une organisation qui demande un retrait ne dit jamais « nous n'aimons pas ».
   Elle produit deux choses de nature différente, et le jeu doit apprendre à les
   distinguer, parce que c'est exactement ce qu'un lecteur de tract, de tribune
   ou de programme électoral doit savoir faire :

   - un argument ÉTAYÉ, adossé à une donnée ou au niveau de preuve de la mesure
     elle-même. Il se vérifie. Il peut être juste et non décisif ;
   - un argument DE PRINCIPE, adossé à une conception de l'école. Il ne se
     vérifie pas, ce qui ne le rend ni faux ni illégitime : une part de la
     politique scolaire est un choix de valeurs, pas un résultat d'étude.

   Le premier est fabriqué à partir des données de la carte elle-même (niveau de
   preuve, effets documentés, coût, postes) : il ne peut donc pas mentir. Le
   second dépend de la famille de la mesure et du profil de l'organisation.
   ========================================================================== */

const COMPTEURS_L = { reussite: 'la réussite des élèves', egalite: 'la réduction des inégalités', sante: 'la santé du système', paix: 'la paix sociale', budget: 'les salaires' };

const PRINCIPES_FAMILLE = {
  moyens: 'Le taux d’encadrement n’est pas une variable d’ajustement budgétaire. Une heure rendue à Bercy est une heure prise à des élèves, quelle que soit la courbe démographique qu’on nous oppose.',
  autonomie: 'L’autonomie des établissements, c’est la mise en concurrence des équipes et la fin du cadre national. Nous défendons un service public identique de Roubaix à Bayonne, pas une collection d’expérimentations locales.',
  parcours: 'Trier les élèves, même provisoirement, même avec les meilleures intentions du monde, c’est assigner. Le collège unique n’est pas un détail d’organisation : c’est une promesse républicaine.',
  autorite: 'L’école n’est pas d’abord un lieu d’ordre, c’est un lieu d’émancipation. Chaque fois qu’on a répondu à une difficulté éducative par un règlement, on a déplacé le problème et fabriqué du décrochage.',
  mixite: 'La carte scolaire est un outil d’égalité, pas une contrainte administrative à négocier établissement par établissement. On ne construit pas la mixité en demandant leur avis à ceux qui la fuient.',
};

/* Les profils les plus durs ajoutent une phrase qui, elle, est franchement une
   position politique, et le jeu le dit. */
const PRINCIPES_PROFIL = {
  frontal: 'Et disons les choses : ce gouvernement n’a aucun mandat pour toucher à l’école. Nous ne négocierons pas la mise en œuvre de ce que nous combattons sur le fond.',
  radical: 'Nous ne sommes pas là pour aménager votre réforme. Nous sommes là pour obtenir son retrait, et nous avons les moyens de l’obtenir.',
  rapport_de_force: 'Nous avons été reçus quatre fois en deux ans. Nous n’avons rien obtenu quatre fois. Vous comprendrez que la discussion ait un coût.',
};

function argumentaireSyndical(carte, org, s) {
  const reels = carte.reel || [];
  const cadMax = Math.max(0, ...reels.map((e) => e.cadenas));
  const negatifs = reels.filter((e) => e.central < 0);
  const postes = carte.coutETP || 0;

  /* --- l'argument étayé : construit à partir de la carte, donc vérifiable --- */
  let etaye, verifiable;
  if (negatifs.length) {
    const n = negatifs[0];
    etaye = `« Votre propre chiffrage documente un effet négatif sur ${COMPTEURS_L[n.compteur] || n.compteur}, de l’ordre de ${n.central} point${n.central <= -2 ? 's' : ''} à ${n.delai} an${n.delai > 1 ? 's' : ''}. Nous ne vous demandons pas de nous croire : nous vous demandons de relire la fiche que vous avez signée. »`;
    verifiable = `Exact, et vérifiable dans le jeu : la mesure porte un effet documenté de ${n.central} sur ce compteur (${n.source}).`;
  } else if (cadMax <= 2) {
    const e = reels[0];
    etaye = `« Cette mesure repose sur ${cadMax} cadenas de preuve sur cinq. Vous engagez ${Math.round((carte.cout || 0) * 1000)} millions d’euros par an sur une hypothèse. Nous demandons une expérimentation évaluée avant toute généralisation. »`;
    verifiable = `Exact. Le niveau de preuve est effectivement de ${cadMax}/5${e ? ` (${e.source})` : ''}. C’est l’argument le plus solide de la délégation, et il ne dit pas que la mesure est mauvaise : il dit qu’on n’en sait pas assez.`;
  } else if (postes < -300) {
    etaye = `« Cette mesure rend ${Math.abs(postes).toLocaleString('fr-FR')} équivalents temps plein. Nous n’avons pas encore vu de classe où la baisse démographique ait supprimé un remplaçant. »`;
    verifiable = `Exact sur les postes. La démographie baisse réellement, mais les deux faits ne se compensent pas là où ils se produisent : le calcul est national, les classes sont locales.`;
  } else {
    etaye = `« Nous ne contestons pas l’effet attendu : votre mesure est correctement étayée (${cadMax} cadenas sur cinq). Nous contestons les conditions de sa mise en œuvre. L’adhésion des personnels est aujourd’hui à ${Math.round((s && s.phys ? s.phys.adhesion : 25))} sur 100. À ce niveau, vous n’obtiendrez pas ce que la recherche promet. »`;
    verifiable = `Exact, et c’est l’argument que le jeu vous oppose depuis le début : votre facteur d’implémentation est indexé sur cette adhésion. Une organisation qui vous dit cela vous décrit votre propre moteur.`;
  }

  /* --- l'argument de principe : légitime, et non vérifiable --- */
  const principe = PRINCIPES_FAMILLE[carte.famille] || PRINCIPES_FAMILLE.moyens;
  const extra = PRINCIPES_PROFIL[org && org.profil];

  return {
    etaye, verifiable,
    principe: extra ? principe + ' ' + extra : principe,
  };
}

];

/* Comparaisons du petit graphique « niveaux » : France face à sa référence. */
